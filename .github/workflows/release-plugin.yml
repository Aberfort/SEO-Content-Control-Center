name: Release Plugin

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & publish WordPress plugin release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Verify plugin version matches tag
        run: npm run plugin:version:verify
        # The VERSION file and tag must match, e.g. tag v0.7.0 → VERSION contains 0.7.0

      - name: Build plugin zip
        run: npm run plugin:package
        # Produces dist/seo-content-control-center-{version}.zip

      - name: Run plugin certification
        run: npm run plugin:release:certify
        env:
          SCCC_PLUGIN_DIST_DIR: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Plugin ${{ github.ref_name }}"
          generate_release_notes: true
          files: dist/seo-content-control-center-*.zip
          fail_on_unmatched_files: true
